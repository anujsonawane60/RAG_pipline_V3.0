version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploaded_files:/app/uploaded_files
      - chat_history:/app/chat_history
      - data:/app/data
    env_file:
      - .env
    restart: always

volumes:
  uploaded_files:
  chat_history:
  data: 