<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - RAG Chatbot Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-toggle {
            text-align: center;
            margin-top: 20px;
        }
        .auth-container .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .auth-bg {
            background-color: #f8f9fa;
            min-height: 100vh;
            padding-top: 50px;
        }
    </style>
</head>
<body class="auth-bg">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">RAG Chatbot Platform</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <!-- Alert container for messages -->
                        <div id="alert-container" class="mb-3"></div>
                        
                        <div id="loginForm" class="auth-container bg-white">
                            <div class="form-header">
                                <h2>Login</h2>
                                <p class="text-muted">Sign in to your account</p>
                            </div>
                            <div id="loginAlert" class="alert alert-danger d-none"></div>
                            <form id="login-form">
                                <div class="mb-3">
                                    <label for="login-username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="login-username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="login-password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="login-password" required>
                                </div>
                                <button type="submit" id="login-submit" class="btn btn-primary w-100 py-2">Login</button>
                            </form>
                            <div class="form-toggle">
                                <p>Don't have an account? <a href="#" id="showRegister">Register</a></p>
                            </div>
                        </div>

                        <div id="registerForm" class="auth-container bg-white d-none">
                            <div class="form-header">
                                <h2>Register</h2>
                                <p class="text-muted">Create a new account</p>
                            </div>
                            <div id="registerAlert" class="alert alert-danger d-none"></div>
                            <form id="register-form">
                                <div class="mb-3">
                                    <label for="register-username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="register-username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="register-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="register-email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="register-fullname" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="register-fullname">
                                </div>
                                <div class="mb-3">
                                    <label for="register-password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="register-password" required>
                                </div>
                                <div class="mb-3">
                                    <label for="register-confirm-password" class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="register-confirm-password" required>
                                </div>
                                <button type="submit" id="register-submit" class="btn btn-primary w-100 py-2">Register</button>
                            </form>
                            <div class="form-toggle">
                                <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© 2024 RAG Chatbot Platform. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check URL parameters to see if we should show registration form
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('register') === 'true') {
                document.getElementById('loginForm').classList.add('d-none');
                document.getElementById('registerForm').classList.remove('d-none');
            }
        });
        
        // Toggle between login and register forms
        document.getElementById('showRegister').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loginForm').classList.add('d-none');
            document.getElementById('registerForm').classList.remove('d-none');
        });
        
        document.getElementById('showLogin').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('registerForm').classList.add('d-none');
            document.getElementById('loginForm').classList.remove('d-none');
        });

        // Clear any existing tokens on page load
        localStorage.removeItem('token');
        localStorage.removeItem('token_type');

        // Function to show alerts
        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            
            // Auto-dismiss success alerts after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    const alert = document.querySelector('.alert');
                    if (alert) {
                        const bsAlert = new bootstrap.Alert(alert);
                        bsAlert.close();
                    }
                }, 5000);
            }
        }

        // Registration form submission
        document.getElementById('register-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const fullname = document.getElementById('register-fullname').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            
            // Clear previous alerts
            document.getElementById('alert-container').innerHTML = '';
            
            // Set button to loading state
            const submitBtn = document.getElementById('register-submit');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Registering...';
            submitBtn.disabled = true;
            
            // Validate password match
            if (password !== confirmPassword) {
                showAlert('Passwords do not match. Please try again.');
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                return;
            }
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        full_name: fullname,
                        password: password
                    })
                });
                
                console.log('Registration response status:', response.status);
                
                if (response.ok) {
                    showAlert('Registration successful! Please log in.', 'success');
                    // Switch to login form
                    document.getElementById('registerForm').classList.add('d-none');
                    document.getElementById('loginForm').classList.remove('d-none');
                    // Clear registration form
                    document.getElementById('register-form').reset();
                } else {
                    const data = await response.json();
                    showAlert(data.detail || 'Registration failed. Please try again.');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('An error occurred during registration. Please try again.');
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });

        // Login form submission
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            // Clear previous alerts
            document.getElementById('alert-container').innerHTML = '';
            
            // Set button to loading state
            const submitBtn = document.getElementById('login-submit');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging in...';
            submitBtn.disabled = true;
            
            try {
                // Create form data for token endpoint
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);
                
                console.log(`Attempting login for user: ${username}`);
                
                const response = await fetch('/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });
                
                console.log('Login response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Login successful:', data);
                    
                    if (data.access_token) {
                        // Store token in localStorage
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('token_type', data.token_type);
                        
                        // Verify token by fetching current user
                        try {
                            const userResponse = await fetch('/users/me', {
                                headers: {
                                    'Authorization': `Bearer ${data.access_token}`
                                }
                            });
                            
                            if (userResponse.ok) {
                                const userData = await userResponse.json();
                                localStorage.setItem('username', userData.username);
                                
                                // Redirect to chatbot page
                                showAlert('Login successful! Redirecting...', 'success');
                                setTimeout(() => {
                                    window.location.href = '/static/chatbot.html';
                                }, 1000);
                            } else {
                                throw new Error('Failed to validate token');
                            }
                        } catch (error) {
                            console.error('Token verification error:', error);
                            showAlert('Login successful but session validation failed. Please try again.');
                            localStorage.removeItem('token');
                            localStorage.removeItem('token_type');
                        }
                    } else {
                        showAlert('Login failed: Invalid response from server');
                    }
                } else {
                    const errorData = await response.json().catch(() => ({ detail: 'Invalid username or password' }));
                    showAlert(errorData.detail || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('An error occurred during login. Please try again.');
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
